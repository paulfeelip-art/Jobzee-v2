<!-- @dsCard group="Sarcina live" height=300 subtitle="Radar cu pinii pe inele de timp" -->
<style>@keyframes sw{to{transform:rotate(360deg)}}</style>
<div class="jz" style="position: relative; height: 290px; background: var(--map-land); overflow: hidden">
  <span style="position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px; border-radius: 50%; background: conic-gradient(rgba(255,159,10,0) 280deg, rgba(255,159,10,.38) 360deg); animation: sw 3.2s linear infinite"></span>
  <span style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 1.5px dashed var(--ink-3)"></span>
  <span style="position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px; border-radius: 50%; border: 1.5px dashed var(--ink-3)"></span>
  <span style="position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 17px; background: var(--surface); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card)"><img src="../../assets/brand/jobzee-mark.png" alt="" style="height: 22px; width: auto"></span>
  <span style="position: absolute; left: calc(50% + 40px); top: calc(50% - 70px)"><img src="../../assets/people/person-jobzer-3.webp" alt="" style="width: 44px; height: 44px; border-radius: 22px; object-fit: cover; border: 3px solid var(--brand); box-sizing: border-box; background: var(--surface-3)"><span style="position: absolute; left: 34px; top: -10px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--brand); color: var(--ink-on-brand); font-size: 12px; font-weight: 500; display: flex; align-items: center; white-space: nowrap">150 lei</span></span>
  <span style="position: absolute; left: calc(50% - 110px); top: calc(50% + 10px)"><img src="../../assets/people/person-jobzer-2.webp" alt="" style="width: 44px; height: 44px; border-radius: 22px; object-fit: cover; border: 3px solid var(--surface); box-sizing: border-box; background: var(--surface-3)"></span>
</div>
