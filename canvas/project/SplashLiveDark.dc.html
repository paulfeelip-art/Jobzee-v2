<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { e: 0 };
  }
  componentDidMount() {
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ e: 99999 }); return; }
    const t0 = Date.now();
    this.iv = setInterval(() => {
      const e = Date.now() - t0;
      this.setState({ e: e });
      if (e > 6200) clearInterval(this.iv);
    }, 40);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const e = this.state.e;
    const k = Math.min(1, Math.max(0, (e - 4100) / 1500));
    const n = Math.round(128 * (1 - Math.pow(1 - k, 3)));
    const h = new Date().getHours();
    const salut = h >= 5 && h < 12 ? 'Bună dimineața!' : h < 18 && h >= 12 ? 'Bună ziua!' : 'Bună seara!';
    const status = e < 4400 ? 'Caut Jobzeri în zona ta…' : e < 5700 ? 'Pregătesc harta ta…' : salut + ' Totul e pregătit.';
    return { n: n, status: status, barSt: 'transition: opacity .4s; opacity: ' + (e > 5800 ? 0 : 1) };
  }
}
</script>
