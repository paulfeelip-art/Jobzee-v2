<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Lucrez</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B35600}a:hover{color:#8F4500}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.u{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.blink{animation:blink 1.4s ease-in-out infinite}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #1C1C1E; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 12px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFF4E5; color: #B35600; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500"><span class="blink" style="width: 7px; height: 7px; border-radius: 4px; background: #FF9F0A"></span>În lucru</span>
    <a href="ChatJobzer.dc.html" class="pr" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: none">Mesaj Andrei</a>
  </div>

  <div class="u" style="display: flex; flex-direction: column; gap: 2px; padding: 4px">
    <span style="font-size: 72px; font-weight: 600; letter-spacing: -3px; line-height: 1; font-variant-numeric: tabular-nums">{{clock}}</span>
    <span style="font-size: 15px; color: #6E6E73">Montaj birou + dulap · primești 150 lei</span>
  </div>

  <div class="u d1" style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="display: flex; justify-content: space-between"><span style="font-size: 17px; font-weight: 500">Poze cu lucrarea gata</span><span style="font-size: 13px; color: #6E6E73">{{count}} adăugate</span></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="2">
        <div class="pop" style="height: 98px; border-radius: 18px; background: {{p.bg}}; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-size: 11px; font-weight: 500; color: #FFFFFF">{{p.label}}</div>
      </sc-for>
      <sc-if value="{{canAdd}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{add}}" aria-label="Adaugă o poză" class="pr" style="height: 98px; border-radius: 18px; border: 1.5px dashed #C7C7CC; background: #FFFFFF; color: #B35600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Adaugă
        </button>
      </sc-if>
    </div>
    <span style="font-size: 13px; color: #6E6E73">Te protejează și intră automat în portofoliul tău.</span>
  </div>

  <a href="#extra" class="u d2 pr" style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #1C1C1E; text-decoration: none">
    <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFF4E5; color: #B35600; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500">+</span>
    <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">Muncă în plus?</span><span style="font-size: 13px; color: #6E6E73">Propui un preț, Andrei aprobă</span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <div style="flex-grow: 1"></div>
  <a href="RecenzieClient.dc.html" class="u d3 pr" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #FF9F0A; color: #1C1C1E; font-size: 17px; font-weight: 500; text-decoration: none; box-shadow: 0 10px 24px rgba(255,159,10,0.35)">Am terminat</a>
  <a href="#problema" style="align-self: center; font-size: 15px; color: #D70015; text-decoration: none; padding: 4px">Raportează o problemă</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 72 * 60 + 40, n: 2 }; }
  componentDidMount() { this.i = setInterval(() => this.setState({ s: this.state.s + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.i); }
  renderVals() {
    const h = Math.floor(this.state.s / 3600), m = Math.floor((this.state.s % 3600) / 60), sec = this.state.s % 60;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const photos = [];
    for (let k = 1; k <= this.state.n; k++) photos.push({ label: ['Birou montat', 'Dulap montat', 'Detaliu: balamale', 'Locul curat'][(k - 1) % 4], bg: 'linear-gradient(transparent 50%, rgba(0,0,0,0.55)), url(assets/services/service-mobila.webp) ' + ['72% 40%/190% auto', '20% 50%/170% auto', '30% 30%/260% auto', '50% 50%/cover'][(k - 1) % 4] + ' no-repeat' });
    return {
      clock: h + ':' + pad(m) + ':' + pad(sec),
      photos, count: this.state.n, canAdd: this.state.n < 5,
      add: () => this.setState({ n: Math.min(this.state.n + 1, 5) })
    };
  }
}
</script>
</body>
</html>
