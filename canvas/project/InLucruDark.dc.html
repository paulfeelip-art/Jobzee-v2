<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 42 * 60 + 10 }; }
  componentDidMount() { this.i = setInterval(() => this.setState({ s: this.state.s + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.i); }
  renderVals() {
    const m = Math.floor(this.state.s / 60), sec = this.state.s % 60;
    return { clock: m + ':' + (sec < 10 ? '0' + sec : sec) };
  }
}
