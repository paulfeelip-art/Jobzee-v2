<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Fără internet · întunecat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFB340}a:hover{color:#FFD08A}
@keyframes down{from{transform:translateY(-100%)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.down{animation:down .5s cubic-bezier(.2,.9,.25,1.1) both}
.u{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.2s}
.spin{animation:spin .9s linear infinite}
.w1{animation:wave 1.6s ease-in-out infinite}.w2{animation:wave 1.6s ease-in-out .2s infinite}.w3{animation:wave 1.6s ease-in-out .4s infinite}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.96)}
@keyframes zf{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}.zf{animation:zf 3.6s ease-in-out infinite}
@keyframes zw{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}}.zw{transform-origin:50% 90%;animation:zw 2.4s ease-in-out .6s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2C2C2E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">
  <div class="down" style="{{bannerStyle}}">
    <sc-if value="{{offline}}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 8a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"></path><path d="M3 3l18 18"></path></svg>
      Fără internet · reîncercăm automat</span></sc-if>
    <sc-if value="{{online}}" hint-placeholder-val="{{ false }}"><span>Conectat din nou ✓</span></sc-if>
  </div>

  <div style="padding: 100px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div class="u" style="align-self: center; position: relative"><img class="zf" src="assets/mascot/zee-ups.png" alt="" style="width: 120px; height: 130px; display: block; "><span style="position: absolute; right: -6px; bottom: 14px; width: 40px; height: 40px; border-radius: 20px; background: #1C1C1E; box-shadow: 0 6px 16px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01M3 3l18 18"></path></svg></span></div>
    <h1 class="u d1" style="margin: 0; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -0.6px">{{title}}</h1>
    <p class="u d1" style="margin: 0; text-align: center; font-size: 15px; line-height: 1.45; color: #98989D">Sarcina ta continuă normal. Codul de start funcționează și fără internet.</p>

    <div class="u d2" style="background: #1C1C1E; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; opacity: 0.8">
      <img src="assets/people/person-jobzer-3.webp" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; flex-shrink: 0">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">Montaj birou + dulap</span><span style="font-size: 13px; color: #98989D">Ultima actualizare 18:42 · cod 4827</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
    <button type="button" onClick="{{retry}}" class="pr" style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #1C1C1E; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>
      {{retryLabel}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 'off' }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state.st;
    return {
      offline: s !== 'on', online: s === 'on', busy: s === 'busy',
      title: s === 'on' ? 'Totul e la zi' : 'Ești offline',
      retryLabel: s === 'busy' ? 'Se conectează…' : s === 'on' ? 'Gata' : 'Reîncearcă acum',
      bannerStyle: 'position: absolute; left: 0; right: 0; top: 0; padding: 50px 16px 12px; display: flex; justify-content: center; font-size: 14px; font-weight: 500; color: #FFFFFF; transition: background .4s; background: ' + (s === 'on' ? '#34C759' : '#48484A'),
      retry: () => {
        if (s !== 'off') return;
        this.setState({ st: 'busy' });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ st: 'on' }), 1500);
      }
    };
  }
}
</script>
</body>
</html>
