<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Confirmă și plătește · întunecat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFB340}a:hover{color:#FFD08A}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes zoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.u{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.draw{stroke-dasharray:40;animation:draw .5s ease-out .35s both}
.zoom{animation:zoom .6s cubic-bezier(.2,.8,.2,1) both}.z2{animation-delay:.12s}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2C2C2E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 12px">
  <a href="InLucruDark.dc.html" aria-label="Înapoi la Înapoi" class="pr" style="align-self: flex-start; width: 40px; height: 40px; border-radius: 20px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(0,0,0,0.08); text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="display: flex; align-items: center; gap: 14px">
    <span class="pop" style="width: 56px; height: 56px; border-radius: 28px; background: #34C759; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </span>
    <h1 class="u" style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 600; letter-spacing: -0.7px">Mihai a terminat</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div class="zoom" style="height: 170px; border-radius: 24px; background: linear-gradient(transparent 55%, rgba(0,0,0,0.55)), url(assets/services/service-mobila.webp) 72% 40%/190% auto no-repeat; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; font-weight: 500; color: #FFFFFF">Birou montat</div>
    <div class="zoom z2" style="height: 170px; border-radius: 24px; background: linear-gradient(transparent 55%, rgba(0,0,0,0.55)), url(assets/services/service-mobila.webp) 20% 50%/170% auto no-repeat; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; font-weight: 500; color: #FFFFFF">Dulap montat</div>
  </div>

  <div class="u d2" style="background: #1C1C1E; border-radius: 22px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 16px"><span style="color: #98989D">Lucrare (preț fix)</span><span>150,00 lei</span></div>
    <div style="display: flex; justify-content: space-between; padding: 12px 16px 12px 0; margin-left: 16px; border-top: 0.5px solid #38383A; font-size: 16px"><span style="color: #98989D">Taxă Jobzee 15%</span><span>22,50 lei</span></div>
    <div style="display: flex; justify-content: space-between; padding: 12px 16px 12px 0; margin-left: 16px; border-top: 0.5px solid #38383A; font-size: 16px"><span style="color: #98989D">Bacșiș</span><span>{{tipTxt}}</span></div>
  </div>

  <div class="u d3" style="background: #1C1C1E; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 500">Bacșiș pentru Mihai · 100% la el</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 10px; background: #2C2C2E">
      <sc-for list="{{tips}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0; text-align: center; font-size: 13px; color: #98989D">Dacă nu răspunzi, confirmăm automat în 48 h.</p>
  <a href="RecenzieDark.dc.html" class="u d4 pr" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #FF9F0A; color: #1C1C1E; font-size: 17px; font-weight: 500; text-decoration: none; box-shadow: 0 10px 24px rgba(255,159,10,0.35)">{{cta}}</a>
  <a href="ProblemaDark.dc.html" style="align-self: center; font-size: 15px; color: #FF6961; text-decoration: none; padding: 4px">Ceva nu e în regulă</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tip: 0 }; }
  fmt(bani) { const l = Math.floor(bani / 100), b = bani % 100; return l + ',' + (b < 10 ? '0' + b : b); }
  renderVals() {
    const tips = [0, 10, 20, 30].map((v) => {
      const on = this.state.tip === v;
      return {
        label: v === 0 ? 'Nu' : v + ' lei', on: on ? 'true' : 'false',
        style: 'height: 34px; border-radius: 8px; border: 0; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: #FFFFFF; transition: background .2s, box-shadow .2s; ' +
          (on ? 'background: #1C1C1E; box-shadow: 0 2px 6px rgba(0,0,0,0.12);' : 'background: transparent;'),
        pick: () => this.setState({ tip: v })
      };
    });
    return {
      tips,
      tipTxt: this.state.tip ? this.fmt(this.state.tip * 100) + ' lei' : '—',
      cta: 'Plătește ' + this.fmt(17250 + this.state.tip * 100) + ' lei'
    };
  }
}
</script>
</body>
</html>
