<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Plăți și termeni</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B35600}a:hover{color:#8F4500}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:75%}to{width:100%}}
@keyframes check{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.u{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
.check{animation:check .35s cubic-bezier(.2,.9,.3,1.5) both}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #1C1C1E; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Identitate.dc.html" aria-label="Înapoi" class="pr" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(0,0,0,0.08)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #E5E5EA; overflow: hidden"><div class="grow" style="height: 100%; border-radius: 3px; background: #FF9F0A"></div></div>
    <span style="font-size: 13px; color: #6E6E73; font-weight: 500">4/4</span>
  </div>

  <h1 class="u" style="margin: 0 4px; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.9px">Unde primești banii?</h1>

  <div class="u d1" style="background: #FFFFFF; border-radius: 22px; overflow: hidden">
    <div style="padding: 10px 16px; display: flex; flex-direction: column; gap: 2px">
      <label for="iban" style="font-size: 12px; color: #6E6E73">IBAN</label>
      <input id="iban" value="RO49 AAAA 1B31 0075 9384 0000" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; letter-spacing: 0.5px; color: #1C1C1E; padding: 0">
    </div>
    <div style="padding: 10px 16px 10px 0; margin-left: 16px; display: flex; flex-direction: column; gap: 2px; border-top: 0.5px solid #D1D1D6">
      <label for="tit" style="font-size: 12px; color: #6E6E73">Titular (ca în actul de identitate)</label>
      <input id="tit" value="Mihai Ionescu PFA" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0">
    </div>
  </div>

  <span class="u d2" style="font-size: 13px; font-weight: 500; color: #6E6E73; padding: 4px 12px 0">CÂND PRIMEȘTI BANII</span>
  <div class="u d2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 10px; background: #E3E3E8">
    <sc-for list="{{pay}}" as="p" hint-placeholder-count="2">
      <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">{{p.label}}</button>
    </sc-for>
  </div>
  <span class="u d2" style="font-size: 13px; color: #6E6E73; padding: 0 12px">{{payNote}}</span>

  <div class="u d3" style="background: #FFFFFF; border-radius: 22px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#8E8E93" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M6 3h9l4 4v14H6z"></path></svg>
    <span style="font-size: 13px; line-height: 1.45; color: #3A3A3C">CUI-ul/CNP-ul și adresa fiscală le cerem pentru raportarea anuală obligatorie (DAC7) la ANAF. Nu le vede niciun client.</span>
  </div>

  <div class="u d4" style="background: #FFFFFF; border-radius: 22px; overflow: hidden">
    <sc-for list="{{terms}}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="{{t.row}}">
        <span style="{{t.box}}"><sc-if value="{{t.isOn}}" hint-placeholder-val="{{ true }}"><span class="check" style="font-size: 13px; font-weight: 700">✓</span></sc-if></span>
        <span style="flex-grow: 1; text-align: left; font-size: 15px; line-height: 1.35">{{t.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="ProfilEdit.dc.html" class="pr" style="{{ctaStyle}}">Termină · completează profilul</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pay: 'week', t0: true, t1: false }; }
  renderVals() {
    const pay = [['week', 'Săptămânal · gratuit'], ['instant', 'Instant · de la Gold']].map(([k, l]) => {
      const on = this.state.pay === k;
      return {
        label: l, on: on ? 'true' : 'false',
        style: 'height: 34px; border-radius: 8px; border: 0; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: #1C1C1E; transition: background .2s, box-shadow .2s; ' + (on ? 'background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12);' : 'background: transparent;'),
        pick: () => this.setState({ pay: k })
      };
    });
    const labels = ['Accept Termenii pentru Jobzeri și Politica de confidențialitate', 'Am citit cum funcționează potrivirea, nivelurile și promovarea'];
    const terms = labels.map((l, i) => {
      const k = 't' + i, on = !!this.state[k];
      return {
        label: l, on: on ? 'true' : 'false', isOn: on,
        row: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; background: #FFFFFF; font-family: inherit; color: #1C1C1E; cursor: pointer; ' + (i > 0 ? 'box-shadow: inset 0 0.5px 0 #D1D1D6;' : ''),
        box: 'width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .2s; ' + (on ? 'background: #FF9F0A; color: #1C1C1E;' : 'background: #FFFFFF; box-shadow: inset 0 0 0 2px #C7C7CC;'),
        toggle: () => { const s = {}; s[k] = !on; this.setState(s); }
      };
    });
    const ok = this.state.t0 && this.state.t1;
    return {
      pay, terms,
      payNote: this.state.pay === 'week' ? 'Banii ajung luni, pentru toate lucrările confirmate.' : 'Transfer în câteva minute, după fiecare lucrare.',
      ctaStyle: 'display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; font-size: 17px; font-weight: 500; text-decoration: none; transition: background .3s, opacity .3s; ' + (ok ? 'background: #FF9F0A; color: #1C1C1E; box-shadow: 0 10px 24px rgba(255,159,10,0.35);' : 'background: #E5E5EA; color: #6E6E73;')
    };
  }
}
</script>
</body>
</html>
