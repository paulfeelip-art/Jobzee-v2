<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Verificare identitate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B35600}a:hover{color:#8F4500}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:50%}to{width:75%}}
@keyframes scan{0%{top:8%}50%{top:84%}100%{top:8%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes check{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.u{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
.scan{animation:scan 2.4s ease-in-out infinite}
.spin{animation:spin .9s linear infinite}
.check{animation:check .35s cubic-bezier(.2,.9,.3,1.5) both}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #1C1C1E; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Skilluri.dc.html" aria-label="Înapoi" class="pr" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(0,0,0,0.08)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #E5E5EA; overflow: hidden"><div class="grow" style="height: 100%; border-radius: 3px; background: #FF9F0A"></div></div>
    <span style="font-size: 13px; color: #6E6E73; font-weight: 500">3/4</span>
  </div>

  <div class="u" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.9px">Cine ești?</h1>
    <p style="margin: 0; font-size: 16px; color: #6E6E73">Clienții îi aleg pe cei verificați. Durează 2 minute.</p>
  </div>

  <div class="u d1" style="height: 168px; border-radius: 26px; background: #1C1C1E; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <div style="width: 230px; height: 140px; border-radius: 16px; border: 2px dashed rgba(255,255,255,0.45); position: relative; display: flex; align-items: center; gap: 14px; padding: 16px; box-sizing: border-box">
      <span style="width: 58px; height: 72px; border-radius: 10px; background: #3A3A3C"></span>
      <span style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1"><span style="height: 8px; border-radius: 4px; background: #3A3A3C"></span><span style="height: 8px; width: 70%; border-radius: 4px; background: #3A3A3C"></span><span style="height: 8px; width: 50%; border-radius: 4px; background: #3A3A3C"></span></span>
      <span class="scan" style="position: absolute; left: 6px; right: 6px; height: 3px; border-radius: 2px; background: #FF9F0A; box-shadow: 0 0 14px #FF9F0A"></span>
    </div>
  </div>

  <div class="u d2" style="background: #FFFFFF; border-radius: 22px; overflow: hidden">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <button type="button" onClick="{{s.run}}" style="{{s.row}}">
        <span style="{{s.iconBox}}">{{s.n}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 16px; font-weight: 500">{{s.title}}</span><span style="font-size: 13px; color: #6E6E73">{{s.sub}}</span></span>
        <sc-if value="{{s.isIdle}}" hint-placeholder-val="{{ true }}"><span style="font-size: 15px; color: #B35600; font-weight: 500">Începe</span></sc-if>
        <sc-if value="{{s.isBusy}}" hint-placeholder-val="{{ false }}"><svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>
        <sc-if value="{{s.isDone}}" hint-placeholder-val="{{ false }}"><span class="check" style="width: 24px; height: 24px; border-radius: 12px; background: #34C759; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">✓</span></sc-if>
      </button>
    </sc-for>
  </div>

  <p class="u d3" style="margin: 0 8px; font-size: 12px; line-height: 1.5; color: #6E6E73">Verificarea o face partenerul nostru autorizat. Jobzee nu păstrează poza actului. Doar persoane de peste 18 ani.</p>

  <div style="flex-grow: 1"></div>
  <a href="PlatiFiscal.dc.html" class="pr" style="{{ctaStyle}}">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: { id: 'done', self: 'idle', caz: 'idle' } }; this.timers = []; }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  renderVals() {
    const list = [
      { k: 'id', n: '1', title: 'Act de identitate', sub: 'Buletin sau pașaport, față-verso' },
      { k: 'self', n: '2', title: 'Selfie video', sub: 'Mișcă ușor capul, 3 secunde' },
      { k: 'caz', n: '3', title: 'Cazier judiciar', sub: 'Încarcă-l sau îl cerem noi online' }
    ];
    const st = this.state.st;
    const steps = list.map((s, i) => {
      const v = st[s.k];
      return {
        n: v === 'done' ? '✓' : s.n, title: s.title, sub: s.sub,
        isIdle: v === 'idle', isBusy: v === 'busy', isDone: v === 'done',
        row: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 0; background: #FFFFFF; font-family: inherit; color: #1C1C1E; cursor: pointer; ' + (i > 0 ? 'box-shadow: inset 0 0.5px 0 #D1D1D6;' : ''),
        iconBox: 'width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; transition: background .3s; ' + (v === 'done' ? 'background: #E8F7EC; color: #1F7A35;' : 'background: #F2F2F7; color: #6E6E73;'),
        run: () => {
          if (v !== 'idle') return;
          const a = Object.assign({}, st); a[s.k] = 'busy'; this.setState({ st: a });
          this.timers.push(setTimeout(() => { const b = Object.assign({}, this.state.st); b[s.k] = 'done'; this.setState({ st: b }); }, 1400));
        }
      };
    });
    const all = Object.keys(st).every((k) => st[k] === 'done');
    return {
      steps,
      cta: all ? 'Continuă' : 'Continuă (cazierul poate veni și mai târziu)',
      ctaStyle: 'display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; text-decoration: none; font-size: ' + (all ? '17px' : '15px') + '; font-weight: 500; transition: background .3s; ' + (all ? 'background: #FF9F0A; color: #1C1C1E; box-shadow: 0 10px 24px rgba(255,159,10,0.35);' : 'background: #FFFFFF; color: #1C1C1E;')
    };
  }
}
</script>
</body>
</html>
