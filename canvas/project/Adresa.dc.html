<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Adresa exactă</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B35600}a:hover{color:#8F4500}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.7);opacity:.18}}
.u{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.3s}.d2{animation-delay:.38s}.d3{animation-delay:.46s}
.sheet{animation:sheet .65s cubic-bezier(.2,.9,.25,1) both}
.bob{animation:bob 1.8s ease-in-out infinite}
.shadow{animation:shadow 1.8s ease-in-out infinite}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #1C1C1E; position: relative; overflow: hidden">
  <svg width="390" height="360" viewBox="0 0 390 360" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
    <rect width="390" height="360" fill="#F5F1E8"></rect>
    <rect x="30" y="200" width="100" height="70" rx="20" fill="#D3EAC7"></rect>
    <rect x="232" y="60" width="70" height="50" rx="12" fill="#ECE6DA"></rect><rect x="232" y="128" width="70" height="44" rx="12" fill="#ECE6DA"></rect>
    <rect x="140" y="60" width="70" height="112" rx="12" fill="#ECE6DA"></rect>
    <path d="M-10 186 L400 186 M120 -10 L120 370 M222 -10 L222 370 M-10 40 L400 40" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"></path>
  </svg>
  <div style="position: absolute; left: 179px; top: 128px; width: 32px; height: 10px; border-radius: 50%; background: #000000" class="shadow"></div>
  <div class="bob" style="position: absolute; left: 175px; top: 84px; width: 40px; height: 48px">
    <svg width="40" height="48" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 27s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" fill="#FF9F0A" stroke="#FFFFFF" stroke-width="2"></path><circle cx="12" cy="11" r="4" fill="#FFFFFF"></circle></svg>
  </div>
  <div style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(28,28,30,0.86); color: #FFFFFF; display: flex; align-items: center; font-size: 13px; font-weight: 500; white-space: nowrap">Mută harta ca să pui pinul pe ușă</div>
  <a href="Fisa.dc.html" aria-label="Înapoi" class="pr" style="position: absolute; left: 16px; top: 52px; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; color: #1C1C1E">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

  <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; top: 300px; background: #F2F2F7; border-radius: 34px 34px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #D1D1D6; align-self: center"></div>
    <span class="u d1" style="font-size: 22px; font-weight: 600; letter-spacing: -0.5px; padding: 0 4px">Unde vine Jobzerul?</span>
    <div class="u d1" style="display: flex; gap: 6px">
      <sc-for list="{{saved}}" as="s" hint-placeholder-count="3">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" class="pr" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
    <div class="u d2" style="background: #FFFFFF; border-radius: 22px; overflow: hidden">
      <div style="padding: 10px 16px; display: flex; flex-direction: column; gap: 2px">
        <label for="str" style="font-size: 12px; color: #6E6E73">Strada și numărul</label>
        <input id="str" value="{{street}}" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0">
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 0.5px solid #D1D1D6">
        <div style="padding: 10px 0 10px 16px; display: flex; flex-direction: column; gap: 2px"><label for="bl" style="font-size: 12px; color: #6E6E73">Bloc</label><input id="bl" value="M4" style="width: 100%; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0"></div>
        <div style="padding: 10px 0 10px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0.5px 0 0 #D1D1D6"><label for="sc" style="font-size: 12px; color: #6E6E73">Scara</label><input id="sc" value="B" style="width: 100%; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0"></div>
        <div style="padding: 10px 0 10px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0.5px 0 0 #D1D1D6"><label for="et" style="font-size: 12px; color: #6E6E73">Etaj</label><input id="et" value="3" style="width: 100%; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0"></div>
        <div style="padding: 10px 0 10px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0.5px 0 0 #D1D1D6"><label for="ap" style="font-size: 12px; color: #6E6E73">Ap.</label><input id="ap" value="12" style="width: 100%; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0"></div>
      </div>
      <div style="padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 0.5px solid #D1D1D6">
        <label for="ins" style="font-size: 12px; color: #6E6E73">Interfon / indicații (opțional)</label>
        <input id="ins" value="Interfon 12, lift în dreapta" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 17px; color: #1C1C1E; padding: 0">
      </div>
    </div>
    <span class="u d3" style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #6E6E73; padding: 0 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#1F7A35" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 2l8 3v7c0 5-4 8.5-8 10-4-1.5-8-5-8-10V5z"></path></svg>
      Adresa exactă o vede doar Jobzerul ales, după ce confirmi plata.
    </span>
    <div style="flex-grow: 1"></div>
    <a href="Fisa.dc.html" class="u d3 pr" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #FF9F0A; color: #1C1C1E; font-size: 17px; font-weight: 500; text-decoration: none; box-shadow: 0 10px 24px rgba(255,159,10,0.35)">Confirmă adresa</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'acasa' }; }
  renderVals() {
    const list = [
      { id: 'acasa', label: 'Acasă', street: 'Str. Barbu Văcărescu nr. 120, Floreasca' },
      { id: 'birou', label: 'Birou', street: 'Bd. Dimitrie Pompeiu nr. 5, Pipera' },
      { id: 'nou', label: '+ Nouă', street: '' }
    ];
    const cur = list.find((x) => x.id === this.state.sel);
    const saved = list.map((x) => {
      const on = x.id === this.state.sel;
      return {
        label: x.label, on: on ? 'true' : 'false',
        style: 'height: 36px; padding: 0 14px; border-radius: 18px; border: 0; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, color .2s; ' +
          (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #FFFFFF; color: #1C1C1E;'),
        pick: () => this.setState({ sel: x.id })
      };
    });
    return { saved, street: cur.street };
  }
}
</script>
</body>
</html>
