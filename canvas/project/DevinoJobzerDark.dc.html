<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Jobzee · Devino Jobzer · întunecat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFB340}a:hover{color:#FFD08A}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes check{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes open{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.u{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .3s both}
.check{animation:check .35s cubic-bezier(.2,.9,.3,1.5) both}
.open{animation:open .4s cubic-bezier(.2,.8,.2,1) both}
.pr{transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}.pr:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2C2C2E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="RolDark.dc.html" aria-label="Înapoi" class="pr" style="width: 40px; height: 40px; border-radius: 20px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(0,0,0,0.08)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #3A3A3C; overflow: hidden"><div class="grow" style="width: 25%; height: 100%; border-radius: 3px; background: #FF9F0A"></div></div>
    <span style="font-size: 13px; color: #98989D; font-weight: 500">1/4</span>
  </div>

  <div class="u" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.9px">Cum lucrezi?</h1>
    <p style="margin: 0; font-size: 16px; color: #98989D">Poți schimba oricând. Îți spunem exact ce ai de făcut.</p>
  </div>

  <div class="u d1" style="background: #1C1C1E; border-radius: 22px; overflow: hidden">
    <sc-for list="{{forms}}" as="f" hint-placeholder-count="3">
      <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" class="pr" style="{{f.style}}">
        <span style="{{f.icon}}">{{f.short}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; text-align: left">
          <span style="font-size: 17px; font-weight: 500">{{f.title}}</span>
          <span style="font-size: 13px; line-height: 1.4; color: #98989D">{{f.sub}}</span>
        </span>
        <sc-if value="{{f.isOn}}" hint-placeholder-val="{{ false }}">
          <svg class="check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{needsCui}}" hint-placeholder-val="{{ true }}">
    <div class="open" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500; color: #98989D; padding: 0 16px">CUI-UL FIRMEI</span>
      <div style="background: #1C1C1E; border-radius: 22px; padding: 0 16px; display: flex; align-items: center; height: 56px">
        <label for="cui" style="position: absolute; left: -9999px">CUI-ul firmei</label>
        <input id="cui" placeholder="ex. RO12345678" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 18px; color: #FFFFFF">
      </div>
      <span style="font-size: 13px; color: #98989D; padding: 0 16px">Îl verificăm automat la ANAF. Emiți tu factura către client.</span>
    </div>
  </sc-if>

  <div style="flex-grow: 1"></div>
  <a href="SkilluriDark.dc.html" class="u d3 pr" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #FF9F0A; color: #1C1C1E; font-size: 17px; font-weight: 500; text-decoration: none; box-shadow: 0 10px 24px rgba(255,159,10,0.35)">Continuă</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { form: 'pfa' }; }
  renderVals() {
    const list = [
      { id: 'pf', short: 'PF', title: 'Persoană fizică', sub: 'Venituri ocazionale, le declari singur la ANAF. Fără cereri cu factură.' },
      { id: 'pfa', short: 'PFA', title: 'PFA sau II', sub: 'Emiți factură, primești și clienți firmă. Recomandat dacă lucrezi des.' },
      { id: 'srl', short: 'SRL', title: 'SRL', sub: 'Pentru echipe și firme mici. Adaugi mai mulți Jobzeri în cont.' }
    ];
    const forms = list.map((f, i) => {
      const on = this.state.form === f.id;
      return {
        short: f.short, title: f.title, sub: f.sub, on: on ? 'true' : 'false', isOn: on,
        style: 'width: 100%; display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 0; cursor: pointer; font-family: inherit; color: #FFFFFF; background: ' + (on ? '#3A2A14' : '#1C1C1E') + '; transition: background .25s; ' +
          (i > 0 ? 'box-shadow: inset 0 0.5px 0 #38383A;' : ''),
        icon: 'width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; transition: background .25s, color .25s; ' +
          (on ? 'background: #FF9F0A; color: #1C1C1E;' : 'background: #2C2C2E; color: #98989D;'),
        pick: () => this.setState({ form: f.id })
      };
    });
    return { forms, needsCui: this.state.form !== 'pf' };
  }
}
</script>
</body>
</html>
